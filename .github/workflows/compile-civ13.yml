name: Pinned Civ13 compilation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-civ13.yml'
      - 'scripts/check_civ13_compile.py'
      - 'scripts/check_civ13_runtime_probe.py'
      - 'scripts/file_inventory.py'
      - 'tools/DmGodot.CompatibilityProbe/**'
      - 'src/DmGodot.Runtime/**'
      - 'scripts/compile.py'
      - 'scripts/bootstrap_opendream.py'
      - 'compatibility/targets.json'
      - 'compatibility/civ13-text-files.json'
  pull_request:
    paths:
      - '.github/workflows/compile-civ13.yml'
      - 'scripts/check_civ13_compile.py'
      - 'scripts/check_civ13_runtime_probe.py'
      - 'scripts/file_inventory.py'
      - 'tools/DmGodot.CompatibilityProbe/**'
      - 'src/DmGodot.Runtime/**'
      - 'scripts/compile.py'
      - 'scripts/bootstrap_opendream.py'
      - 'compatibility/targets.json'
      - 'compatibility/civ13-text-files.json'

permissions:
  contents: read

jobs:
  compile-civ13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the complete pinned target
        uses: actions/checkout@v4
        with:
          repository: Civ13/Civ13
          ref: 98f34be22b7c594de1b9b113f9962cd61f6f0091
          path: vendor/Civ13
          persist-credentials: false
      - name: Build pinned unmodified OpenDream compiler
        run: python scripts/bootstrap_opendream.py
      - name: Build the standalone runtime probe
        run: dotnet build tools/DmGodot.CompatibilityProbe/DmGodot.CompatibilityProbe.csproj -c Release --nologo -m:1 -p:UseSharedCompilation=false
      - name: Compile probe fixture and verify real-process phase handling
        run: |
          python scripts/compile.py fixtures/smoke/smoke.dme --output build/probe-smoke.json
          python -m unittest discover -s tools/DmGodot.CompatibilityProbe/tests -p 'test_*.py' -v
      - name: Compile unchanged Civ13 and check source cleanliness
        run: python scripts/check_civ13_compile.py vendor/Civ13
      - name: Measure first runtime compatibility boundary without hosting
        env:
          # Diagnostic 2 GiB GC heap cap after the 1 GiB construction OOM; not a memory optimization.
          DOTNET_GCHeapHardLimit: '0x80000000'
        run: python scripts/check_civ13_runtime_probe.py --tracked-source-files --allowlisted-source-text
      - name: Preserve diagnostics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ13-frontend-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/civ13/civ13.compiler.log
            build/civ13/civ13.provenance.json
            build/civ13/reproduction.json
            build/civ13/runtime-probe.json
            build/civ13/file-inventory.json
